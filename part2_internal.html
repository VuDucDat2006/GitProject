<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Phần 2: Nhúng CSS bằng Internal-style</title>
    <!-- Phần 2: Thay đổi màu sắc của văn bản sử dụng internal-style trong thẻ head -->
    <style>
        h1 {
            color: #059669; /* Màu xanh lá cây */
        }
        p {
            color: #d97706; /* Màu cam */
        }
    </style>
</head>
<body>
    <h1>Tiêu đề sử dụng Internal-style (Màu xanh lá)</h1>
    <p>Đây là đoạn văn được đổi sang màu cam bằng cách sử dụng thẻ style đặt bên trong thẻ head (internal-style).</p>
</body>
</html>
