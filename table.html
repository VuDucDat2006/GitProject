<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bảng đơn giản trong HTML</title>
        <style>
            body {
                font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background-color: #f8fafc;
                padding: 40px 20px;
                margin: 0;
            }
            .container {
                max-width: 600px;
                margin: 0 auto;
                background: #ffffff;
                padding: 30px 35px;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
                border: 1px solid #e2e8f0;
            }
            h2 {
                color: #1e40af;
                margin-top: 0;
                margin-bottom: 20px;
                border-bottom: 2px solid #dbeafe;
                padding-bottom: 10px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
            }
            th, td {
                padding: 12px 16px;
                text-align: left;
                border: 1px solid #cbd5e1;
            }
            th {
                background-color: #eff6ff;
                color: #1e3a8a;
                font-weight: bold;
            }
            tr:nth-child(even) {
                background-color: #f8fafc;
            }
            tr:hover {
                background-color: #f1f5f9;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Danh sách học sinh</h2>
            <table border="1">
                <tr>
                    <th>Họ và Tên</th>
                    <th>Tuổi</th>
                    <th>Lớp</th>
                </tr>
                <tr>
                    <td>Nguyễn Văn A</td>
                    <td>15</td>
                    <td>10A1</td>
                </tr>
                <tr>
                    <td>Trần Thị B</td>
                    <td>16</td>
                    <td>11B2</td>
                </tr>
                <tr>
                    <td>Lê Văn C</td>
                    <td>17</td>
                    <td>12C3</td>
                </tr>
            </table>
        </div>
    </body>
</html>
