<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form</title>
    <style>
        body {
            background-color: #f1f5f9;
            padding: 30px 20px;
            margin: 0;
        }
        .wufoo {
            font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
            background-color: #ffffff;
            max-width: 480px;
            margin: 0 auto;
            padding: 30px 35px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #cbd5e1;
        }
        .wufoo h2 {
            margin-top: 0;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .wufoo p {
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #334155;
            font-size: 14px;
        }
        .wufoo select, .wufoo input[type="text"] {
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }
        .wufoo select:focus, .wufoo input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .wufoo input[type="button"] {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 8px 24px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .wufoo input[type="button"]:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>
    <form method="get" action="simpleform.html" class="wufoo">
        <h2>Order Form</h2>
        
        <p>What would you like to buy?</p>
        <select>
            <option value="  ">A</option>
            <option>B (+  0.5$)</option>
            <option>C (+  0.5$)</option>
        </select>

        <p>How many would you like to order?</p>
        <input type="radio" name="rd"/> 1 - $10 <br/>
        <input type="radio" name="rd"/> 2 - $20 <br/>
        <input type="radio" name="rd"/> 3 - $25 <br/>

        <p>Name <span style="color: red">*</span> </p>
        <input type="text" name="firstname" placeholder="FirstName" size="15"/>
        <input type="text" name="lastname" placeholder="LastName" size="15"/>

        <p>Email</p>
        <input type="text" name="email" size="35"/>

        <p>Phone Number</p>
        <input type="text" name="phone1" size="5"/> -
        <input type="text" name="phone2" size="5"/> -
        <input type="text" name="phone3" size="5"/>

        <p style="margin-top: 20px;">
            <input type="button" name="btSubmit" value="Submit"/>
        </p>
    </form>
</body>
</html>
