<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định dạng văn bản với HTML Styles</title>
    <style>
        /* Khung bao viền nhẹ để giao diện hiển thị gọn gàng khi xem trên trình duyệt */
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. Tiêu đề h1 có màu xanh dương -->
        <h1 style="color: blue;">Bài viết của tôi</h1>

        <!-- 2. Đoạn văn p có màu đỏ và chữ in đậm -->
        <p style="color: red; font-weight: bold;">Đây là đoạn văn được định dạng màu sắc</p>

        <!-- 3. Đoạn văn p có chữ in nghiêng và căn giữa -->
        <p style="font-style: italic; text-align: center;">Tôi đang học HTML Styles</p>

        <!-- 4. Đoạn văn p có kích thước chữ 20px và gạch chân -->
        <p style="font-size: 20px; text-decoration: underline;">Định dạng văn bản giúp trang web đẹp hơn</p>
    </div>
</body>
</html>
