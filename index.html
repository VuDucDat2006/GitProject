<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 40px 20px;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }

        h1 {
            color: #1e40af;
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 2px solid #dbeafe;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
        }

        th {
            background-color: #eff6ff;
            color: #1e3a8a;
            font-weight: 700;
            text-align: center;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }

        td:nth-child(2) {
            text-align: right;
            font-family: "Courier New", Courier, monospace;
            font-weight: 600;
            color: #0369a1;
        }

        td:nth-child(3) {
            text-align: center;
            font-weight: 600;
            color: #15803d;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .summary-row {
            background-color: #f1f5f9;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Danh sách sản phẩm</h1>

        <table border="1">
            <thead>
                <tr>
                    <th>Tên sản phẩm</th>
                    <th>Giá</th>
                    <th>Số lượng</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Laptop Dell XPS 13</td>
                    <td>25.000.000 đ</td>
                    <td>15</td>
                </tr>
                <tr>
                    <td>iPhone 15 Pro Max</td>
                    <td>30.000.000 đ</td>
                    <td>20</td>
                </tr>
                <tr>
                    <td>Bàn phím cơ Logitech G Pro</td>
                    <td>1.850.000 đ</td>
                    <td>45</td>
                </tr>
                <tr>
                    <td>Chuột không dây Logitech MX Master 3S</td>
                    <td>2.100.000 đ</td>
                    <td>30</td>
                </tr>
                <tr>
                    <td>Tai nghe Sony WH-1000XM5</td>
                    <td>7.500.000 đ</td>
                    <td>18</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
