<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành thẻ hình ảnh trong HTML</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f4f8;
            color: #1e293b;
            padding: 40px 20px;
            text-align: center;
            margin: 0;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        h1 {
            color: #0f766e;
            font-size: 1.85rem;
            margin-bottom: 25px;
            border-bottom: 2px solid #ccfbf1;
            padding-bottom: 12px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            display: block;
            margin: 0 auto;
        }
        .caption {
            color: #64748b;
            font-size: 15px;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Khám Phá Thiên Nhiên Hùng Vĩ</h1>

        <!-- Thẻ img hiển thị hình ảnh yêu thích với thuộc tính alt mô tả chi tiết -->
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" 
             alt="Phong cảnh thung lũng núi non hùng vĩ và dòng sông uốn lượn dưới ánh hoàng hôn tuyệt đẹp" 
             width="600">

        <p class="caption">Hình ảnh: Thung lũng Yosemite với dòng sông và rặng núi đá tráng lệ.</p>
    </div>
</body>
</html>
